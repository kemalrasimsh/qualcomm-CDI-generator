name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CDI_COMMIT: 98a7d735d9592c1ccca0130e06b0709f4b65ecbf # v1.1.0

jobs:
  lava-schema:
    name: LAVA schema
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/lava-schema-check.yml

  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        # The generator imports PyYAML at startup, so the tests that load it
        # need it present. Unpinned, so the resolver picks a release the
        # matrix Python supports.
        run: python -m pip install PyYAML

      - name: Run structural tests
        run: >
          python -m unittest
          tests.test_cdi_validation.StructuralTests
          tests.test_lava_ci
          tests.test_qcom_image_resolver
          -v

  cdi-validation:
    name: CDI validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install CDI validator
        run: |
          cdi_ref="$CDI_COMMIT"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            release_metadata="$RUNNER_TEMP/cdi-release.json"
            curl --fail --silent --show-error \
              --output "$release_metadata" \
              https://api.github.com/repos/cncf-tags/container-device-interface/releases/latest
            cdi_ref="$(python -c \
              'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["tag_name"])' \
              "$release_metadata")"
          fi
          git init --quiet "$RUNNER_TEMP/cdi-source"
          git -C "$RUNNER_TEMP/cdi-source" remote add origin \
            https://github.com/cncf-tags/container-device-interface.git
          git -C "$RUNNER_TEMP/cdi-source" fetch --quiet --depth=1 origin "$cdi_ref"
          git -C "$RUNNER_TEMP/cdi-source" checkout --quiet --detach FETCH_HEAD
          (
            cd "$RUNNER_TEMP/cdi-source/cmd/cdi"
            go build -o "$RUNNER_TEMP/cdi" .
          )
          sudo mkdir --parents /etc/cdi /var/run/cdi
          echo "CDI_TOOL=$RUNNER_TEMP/cdi" >> "$GITHUB_ENV"

      - name: Install runtime dependencies
        run: python -m pip install PyYAML

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools
        run: |
          python -m pip install --requirement requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes systemd-dev

      - name: Check package version consistency
        run: |
          setup_version="$(python -c 'import configparser; c = configparser.ConfigParser(); c.read("setup.cfg"); print(c["metadata"]["version"])')"
          meson_version="$(sed -n "s/.*version : '\([^']*\)'.*/\1/p" meson.build)"
          test "$setup_version" = "$meson_version"

      - name: Build and smoke-test Python packages
        run: |
          python -m build
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          # With its dependencies, so the --help run below exercises what the
          # wheel declares: the generator imports PyYAML at startup.
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "$wheel_path"
          test -x "$RUNNER_TEMP/wheel-smoke/sbin/qualcomm-cdi-generator.py"
          "$RUNNER_TEMP/wheel-smoke/bin/python" \
            "$RUNNER_TEMP/wheel-smoke/sbin/qualcomm-cdi-generator.py" --help

      - name: Build and smoke-test Meson installation
        run: |
          meson setup build/meson --prefix=/usr
          DESTDIR="$RUNNER_TEMP/meson-root" meson install -C build/meson
          test -x "$RUNNER_TEMP/meson-root/usr/sbin/qualcomm-cdi-generator.py"
          test -f "$RUNNER_TEMP/meson-root/usr/lib/systemd/system/qualcomm-cdi-generator.service"
          test -f "$RUNNER_TEMP/meson-root/usr/lib/systemd/system-preset/10-qualcomm-cdi-generator.preset"
          python "$RUNNER_TEMP/meson-root/usr/sbin/qualcomm-cdi-generator.py" --help

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Python checks
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check qualcomm-cdi-generator.py ci tests

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r commit; do
            author="$(git show --no-patch --format='%an <%ae>' "$commit")"
            signoffs="$(git show --no-patch --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")"
            if [[ "$author" == "dependabot[bot] <"* ]]; then
              expected="dependabot[bot] <"
              match_args=(-Fiq)
            else
              expected="$author"
              match_args=(-Fixq)
            fi
            if ! grep "${match_args[@]}" "$expected" <<< "$signoffs"; then
              echo "::error::Commit $(git show --no-patch --format='%h %s' "$commit") lacks a matching Signed-off-by trailer"
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
